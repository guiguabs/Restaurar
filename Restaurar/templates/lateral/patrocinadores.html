<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrocinadores - Restaurar F.C</title>
    <!-- CSS Global puxado da pasta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        /* Estilos específicos para a grade de patrocinadores */
        .patrocinadores-container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .patrocinadores-container h2 {
            color: #ffffff;
            margin-bottom: 30px;
            font-size: 26px;
            letter-spacing: 0.5px;
        }

        .grid-patrocinadores {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .card-patrocinador {
            background: rgba(11, 15, 25, 0.85);
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card-patrocinador:hover {
            transform: translateY(-4px);
            border-color: #2563eb;
        }

        .card-patrocinador h3 {
            color: #60a5fa;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .card-patrocinador p {
            color: #94a3b8;
            font-size: 14px;
            line-height: 1.4;
            margin: 0;
        }
    </style>
</head>
<body>

    <!-- Tarja Superior com Degradê -->
    <header class="cabecalho-tarja">
        <h1>Olá, {{ nome }}! (<span class="destaque-clube">Restaurar F.C</span>)</h1>
        <a href="/logout" class="btn-sair">Sair</a>
    </header>

    <!-- Menu Lateral Retrátil -->
    <div class="sidebar">
        <div class="sidebar-titulo">Menu do Clube</div>
        <ul class="sidebar-links">
            <li><a href="/painel">Painel Principal</a></li>
            <li><a href="/jogos">Data de Jogos</a></li>
            <li><a href="/patrocinadores">Patrocinadores</a></li>
            <li><a href="/historia">História do Time</a></li>
            <li><a href="/conquistas">Seção de Conquistas</a></li>
        </ul>
    </div>

    <!-- Conteúdo Principal: Patrocinadores -->
    <div class="patrocinadores-container">
        <h2>Parceiros e Patrocinadores oficiais</h2>
        
        <div class="grid-patrocinadores">
            <!-- Patrocinador 1 -->
            <div class="card-patrocinador">
                <h3>Patrocinador</h3>
            </div>

            <!-- Patrocinador 2 -->
            <div class="card-patrocinador">
                <h3>Patrocinador</h3>
            </div>

            <!-- Patrocinador 3 -->
            <div class="card-patrocinador">
                <h3>Patrocinador</h3>
            </div>
        </div>
    </div>

</body>
</html>
