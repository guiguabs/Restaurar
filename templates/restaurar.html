<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel - Restaurar F.C</title>
    
    <!-- Puxa o estilo global limpo -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <style>
        /* --- FUNDO COM MENOS DESFOQUE E MAIS TRANSPARÊNCIA --- */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url("{{ url_for('static', filename='escudo.jpg') }}");
            background-size: cover;
            background-position: center;
            
            /* AQUI ESTÁ A MÁGICA: */
            filter: blur(3px); /* Reduzi o desfoque de 10px para 3px (fica bem mais nítido) */
            opacity: 0.35; /* Adicionei transparência (vai de 0.0 a 1.0) para misturar com o fundo escuro */
            
            z-index: -1;
            transform: scale(1.02); /* Diminuí a escala já que o desfoque é menor */
        }
    </style>
</head>
<body>

    <header class="cabecalho-tarja">
        <h1>Olá, {{ nome }}! (<span class="destaque-clube">Restaurar F.C</span>)</h1>
        <a href="/logout" class="btn-sair">Sair</a>
    </header>

    <div class="sidebar">
        <div class="sidebar-titulo">Menu do Clube</div>
        <ul class="sidebar-links">
            <li><a href="/jogos">Data de Jogos</a></li>
            <li><a href="/patrocinadores">Patrocinadores</a></li>
            <li><a href="/historia">História do Time</a></li>
            <li><a href="/conquistas">Seção de Conquistas</a></li>
            <li><a href="/noticias">Notícias</a></li>
        </ul>
    </div>

    <div class="painel-container">
        <h2>Bem-vindo de volta!</h2>
        <p>Você entrou com sucesso no sistema do Restaurar F.C. Esta é a sua área restrita.</p>
    </div>

</body>
</html>
