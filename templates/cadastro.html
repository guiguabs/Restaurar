<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Restaurar F.C</title>
    <!-- CSS Global puxado da pasta static -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Tarja Superior -->
    <header class="cabecalho-tarja">
        <h1>Restaurar F.C</h1>
        <a href="/" class="btn-voltar">Voltar</a>
    </header>

    <!-- Formulário de Cadastro -->
    <div class="auth-container">
        <h2>Criar Conta</h2>

        <!-- Se houver erro enviado pelo backend, ele aparece aqui -->
        {% if erro %}
            <div class="alerta-erro">{{ erro }}</div>
        {% endif %}

        <form action="/cadastrar" method="POST">
            <div class="form-group">
                <label for="nome">Nome Completo</label>
                <input type="text" id="nome" name="nome" required placeholder="Digite seu nome">
            </div>

            <div class="form-group">
                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" name="senha" required placeholder="Sua senha segura">
            </div>

            <!-- Campo para selecionar se é Atleta ou Torcedor -->
            <div class="form-group">
                <label for="tipo">Você é:</label>
                <select id="tipo" name="tipo" required>
                    <option value="" disabled selected>Selecione uma opção</option>
                    <option value="atleta">Atleta</option>
                    <option value="torcedor">Torcedor</option>
                </select>
            </div>

            <button type="submit" class="btn-submit">Finalizar Cadastro</button>
        </form>
    </div>

</body>
</html>
